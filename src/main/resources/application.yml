spring:
  application:
    name: travel-price-memory
  data:
    redis:
      host: localhost
      port: 6379

travel:
  cache:
    latest-price-ttl: 15m
  hbase:
    quorum: localhost
    client-port: 2181
    znode-parent: /hbase
    flight-table: travel_flight_prices
    hotel-table: travel_hotel_prices
    salt-buckets: 16
